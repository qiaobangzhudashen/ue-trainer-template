# 新游戏只填这个文件.引擎和UI不动.
# agent 工作流: CE 里搜断反补丁调通后,把 AOB/偏移/开字节/关字节填进来;
# 需要申请内存的复杂逻辑用 type: cave,把 CE 里调通的机器码贴进 cave_hex.

game: _TEMPLATE
exe: Game-Win64-Shipping.exe
# Mod 在游戏目录下的相对路径 (UE4SS Mod 目录)
mod_rel: Game/Binaries/Win64/ue4ss/Mods/GameTrainer
# 官方发奖函数 (Lua 侧用,物品添加走这条,不走内存)
give_func: BirdLetterSystem:AwardSomeItems

patches:
  # 例1: 简单原地补丁 (nop 掉扣除)
  # nospend:
  #   desc: 扣除不扣
  #   type: bytes
  #   aob: "66410F6E4104F3410F104C10740F5BC0"
  #   offset: 0x10
  #   on_bytes: "90909090"
  #   off_bytes: "F30F5CC8"

  # 例2: 跳转改向 (jge->jmp)
  # checkpass:
  #   desc: 检查放行
  #   type: bytes
  #   aob: "F3440F2C4174"
  #   offset: 0x0D
  #   on_bytes: "EB18"
  #   off_bytes: "7D18"

  # 例3: 代码洞 (原地5字节以上,E9跳洞,洞执行完自动跳回)
  # 场景:只对特定物品免扣 / 条件分支 / 寄存器保护,简单nop满足不了时用.
  # cave_hex 为洞内机器码(不含尾部跳回,引擎自动追加).
  # 由 agent 在 CE 里用 auto assemble 调通后贴 hex,勿手编.
  # conditional_nospend:
  #   desc: 条件免扣示例 (示意,需按真游戏重填)
  #   type: cave
  #   aob: "66410F6E4104F3410F104C10740F5BC0"
  #   offset: 0x0
  #   overwrite_len: 6
  #   off_bytes: "66410F6E4104F3"   # 原地6字节备份 (恢复用,长度=overwrite_len)
  #   cave_hex: "909090909090"      # 洞内逻辑 (示例nop,真逻辑贴实测机器码)
  #   data_size: 8                 # 洞内要读写外部数(倍数/指针)才加;洞里用
  #                                # 0xAAAAAAAAAAAAAAAA(8字节token)占位,引擎回填
  #                                # 真地址并清零.开了补丁后 UI 自动出"写数据"行:
  #                                # data_type: qword # byte/word/dword/qword/float/double,默认qword
  #                                # data_default: "10" # UI 输入框默认值(可选)

# UI 开关与 Lua 命令的联动 (一勾同时驱动 Lua hook + 内存补丁)
toggles:
  # free:
  #   label: 免费模式 (无视材料检查)
  #   lua_on: "lv_free on"
  #   lua_off: "lv_free off"
  #   mem: [nospend, checkpass]

packs:
